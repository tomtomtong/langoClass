<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lecture · Lango Class</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      background: #f3eefa;
      color: #1f1a24;
      font-family: "Nunito", sans-serif;
    }
    h1 { margin: 0; font-size: clamp(20px, 2.4vw, 30px); font-weight: 900; color: #4b2a6b; text-align: center; }
    #lecture {
      width: min(100%, calc((100vh - 120px) * 16 / 9));
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(75, 42, 107, 0.18);
    }
  </style>
</head>
<body>
  <h1 id="lecture-title">Lecture</h1>
  <div id="lecture"></div>

  <!-- Prototype: plays /uploads/lectures/<id>/lecture.json live, no MP4. ?src= picks another lecture.json. -->
  <script src="/vendor/gsap/gsap.min.js"></script>
  <script src="/lecture-player.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const src = params.get("src") || "/uploads/lectures/lango-cambridge-s8-u1-1/lecture.json";
      const player = await LangoLecturePlayer.mount(document.getElementById("lecture"), src);
      document.getElementById("lecture-title").textContent = player.lecture.title || "Lecture";
      document.title = `${player.lecture.title} · Lango Class`;
    })().catch((error) => console.error("[lecture]", error));
  </script>
</body>
</html>
