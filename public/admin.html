<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>LangoClass · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/log.css" />
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <section id="screen-login" class="screen active" aria-label="Admin sign in">
    <form class="login-card" id="login-form" onsubmit="return false">
      <img class="login-logo" src="/assets/login/langoclass_logo.svg" alt="Lango Classroom" />
      <p class="kicker">School admin</p>
      <h1>Admin access</h1>
      <p class="hint">For school administrators. Teachers sign in at the <a href="/cms.html">Course CMS</a>.</p>
      <label class="field">
        <span>Username</span>
        <input id="login-username" type="text" autocomplete="username" />
      </label>
      <label class="field">
        <span>Password</span>
        <input id="login-password" type="password" autocomplete="current-password" />
      </label>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn primary" type="button" id="btn-login">Login</button>
    </form>
  </section>

  <div id="app-shell" class="app-shell" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="/assets/login/langoclass_logo.svg" alt="" width="36" height="36" />
        <div>
          <strong>Admin</strong>
          <span id="admin-label">Admin</span>
        </div>
      </div>
      <div class="topbar-actions">
        <a class="btn ghost" href="/cms.html">Course CMS</a>
        <button class="btn ghost" type="button" id="btn-logout">Log out</button>
      </div>
    </header>

    <main class="admin-main">
      <section class="admin-card">
        <p class="kicker">Signed in</p>
        <h2 id="admin-name">Admin</h2>
        <p class="hint" id="admin-school"></p>
      </section>
      <section class="admin-card">
        <p class="kicker">Schools</p>
        <p class="empty">Not connected yet.</p>
      </section>
      <section class="admin-card">
        <p class="kicker">Teachers</p>
        <p class="empty">Not connected yet.</p>
      </section>
      <section class="admin-card">
        <p class="kicker">Course assignment</p>
        <p class="empty">Not connected yet.</p>
      </section>
    </main>
  </div>

  <script src="/turnstile.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
